name: Backend

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      # Gleiche Installation wie rag_backend/Dockerfile.api.
      - name: Abhängigkeiten
        run: uv pip install --system -r rag_backend/pyproject.toml
      # Die Tests setzen ihre Umgebung selbst (SQLite, Test-Secrets) und brauchen
      # keine laufenden Container.
      - name: Tests
        run: python -m pytest rag_backend/tests -q -p no:cacheprovider
      # Im Sandbox-Abbild, nicht auf dem Runner: Dort raeumt die Sandbox zwischen zwei
      # Laeufen auf (Prozesse beenden, /tmp leeren), und genau das wird mitgeprueft.
      - name: Calc-Sandbox Tests
        run: |
          docker build -q -t argus-sandbox-test -f calc_sandbox/Dockerfile.sandbox calc_sandbox
          docker run --rm --user root -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/calc_sandbox:/src" -w /src --entrypoint sh argus-sandbox-test \
            -c "pip install -q pytest httpx && exec python -m pytest test_app.py -q -p no:cacheprovider"
      # Die Oberflaeche hat keinen Build-Schritt: ein Tippfehler in einem Skript
      # fiele sonst erst im Browser auf.
      - name: Oberflaeche (JavaScript-Syntax)
        run: |
          for f in rag_backend/static/js/*.js; do node --check "$f"; done
      - name: Installer-Skripte (ShellCheck)
        run: |
          bash -n install.sh
          shellcheck install.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nur Syntax: ohne -q gaebe 'config' die aufgeloeste Umgebung aus.
      - name: docker compose config
        run: |
          touch .env
          docker compose config -q
      # Wer ins Internet darf, wer Ports veroeffentlicht. Das Skript gibt nur Namen aus.
      - name: Netz-Abschottung
        run: |
          docker compose config --format json | python3 setup/check_networks.py
