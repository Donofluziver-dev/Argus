name: Backend

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      # Lock-Dateien passen zu ihren Quellen: uv.lock zu pyproject.toml, die Exporte zu
      # uv.lock, und jede requirements*.lock der Dienste zu ihrer .in (neu aufgeloest mit
      # den bisherigen Versionen als Vorgabe, also ohne Aktualisierung).
      - name: Lock-Dateien aktuell
        run: |
          set -euo pipefail
          cd rag_backend
          uv lock --check
          for spec in "requirements.lock:--no-dev" "requirements-dev.lock:--only-dev"; do
            ziel="${spec%%:*}"; art="${spec#*:}"
            uv export --frozen $art --no-emit-project --format requirements-txt --no-header -q -o "/tmp/$ziel"
            diff <(grep -v '^#' "$ziel") <(grep -v '^#' "/tmp/$ziel")
          done
          cd ..
          pruefe() {
            local ordner="$1" eingabe="$2" ausgabe="$3"; shift 3
            cp "$ordner/$ausgabe" "/tmp/$ausgabe"
            (cd "$ordner" && uv pip compile "$eingabe" "$@" --generate-hashes --no-header -q -o "/tmp/$ausgabe")
            diff <(grep -v '^#' "$ordner/$ausgabe") <(grep -v '^#' "/tmp/$ausgabe")
          }
          pruefe calc_sandbox requirements.in requirements.lock --universal --python-version 3.13
          pruefe calc_sandbox requirements-test.in requirements-test.lock -c requirements.lock --universal --python-version 3.13
          pruefe stt_service requirements.in requirements.lock --universal --python-version 3.13
          pruefe stt_service requirements-gpu.in requirements-gpu.lock -c requirements.lock --universal --python-version 3.13
          pruefe tts_service requirements.in requirements.lock --universal --python-version 3.12
      # Gleiche Pakete wie rag_backend/Dockerfile.api, dazu die Testpakete.
      - name: Abhängigkeiten
        run: uv pip install --system --require-hashes -r rag_backend/requirements.lock -r rag_backend/requirements-dev.lock
      # Die Tests setzen ihre Umgebung selbst (SQLite, Test-Secrets) und brauchen
      # keine laufenden Container.
      - name: Tests
        run: python -m pytest rag_backend/tests -q -p no:cacheprovider
      # Im Sandbox-Abbild, nicht auf dem Runner: Dort raeumt die Sandbox zwischen zwei
      # Laeufen auf (Prozesse beenden, /tmp leeren), und genau das wird mitgeprueft.
      - name: Calc-Sandbox Tests
        run: |
          docker build -q --target test -t argus-sandbox-test -f calc_sandbox/Dockerfile.sandbox calc_sandbox
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=256m,noexec \
            --security-opt no-new-privileges:true \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add KILL \
            --ipc private --sysctl kernel.shmmni=0 --sysctl kernel.shmall=0 \
            --sysctl kernel.msgmni=0 --sysctl "kernel.sem=0 0 0 0" \
            --memory 512m --cpus 1.0 --pids-limit 256 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            argus-sandbox-test
      # Die Oberflaeche hat keinen Build-Schritt: ein Tippfehler in einem Skript
      # fiele sonst erst im Browser auf.
      - name: Oberflaeche (JavaScript-Syntax)
        run: |
          for f in rag_backend/static/js/*.js; do node --check "$f"; done
      - name: Installer-Skripte (ShellCheck)
        run: |
          bash -n install.sh
          bash -n setup/bootstrap.sh
          shellcheck install.sh setup/bootstrap.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nur Syntax: ohne -q gaebe 'config' die aufgeloeste Umgebung aus.
      - name: docker compose config
        run: |
          touch .env
          docker compose config -q
          docker compose --profile voice config -q
          docker compose --profile tracing config -q
          docker compose --profile web config -q
          docker compose --profile proxy config -q
          docker compose --profile voice --profile tracing --profile web --profile proxy config -q
          # Suche und Sprache auf der Grafikkarte (die Installation bindet diese Dateien ein).
          docker compose -f docker-compose.yml -f compose/gpu-suche.yml -f compose/gpu-sprache.yml --profile voice config -q
          # Code-Sandbox unter gVisor.
          docker compose -f docker-compose.yml -f compose/sandbox-gvisor.yml config -q
      # Wer ins Internet darf, wer Ports veroeffentlicht. Das Skript gibt nur Namen aus.
      - name: Netz-Abschottung
        run: |
          docker compose config --format json | python3 setup/check_networks.py
          docker compose --profile voice --profile tracing --profile web --profile proxy config --format json | python3 setup/check_networks.py
          docker compose -f docker-compose.yml -f compose/gpu-suche.yml -f compose/gpu-sprache.yml --profile voice --profile tracing --profile web --profile proxy config --format json | python3 setup/check_networks.py
          docker compose -f docker-compose.yml -f compose/sandbox-gvisor.yml --profile voice --profile tracing --profile web --profile proxy config --format json | python3 setup/check_networks.py

  # Dieselben Sandbox-Tests unter gVisor: Die Installation nutzt es, sobald runsc auf dem
  # Server eingerichtet ist (compose/sandbox-gvisor.yml).
  sandbox-gvisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gVisor einrichten
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - name: Calc-Sandbox Tests unter gVisor
        run: |
          docker build -q --target test -t argus-sandbox-test -f calc_sandbox/Dockerfile.sandbox calc_sandbox
          docker run --rm --runtime runsc --network none --read-only \
            --tmpfs /tmp:size=256m,noexec \
            --security-opt no-new-privileges:true \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add KILL \
            --ipc private --sysctl kernel.shmmni=0 --sysctl kernel.shmall=0 \
            --sysctl kernel.msgmni=0 --sysctl "kernel.sem=0 0 0 0" \
            --memory 512m --cpus 1.0 --pids-limit 256 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            argus-sandbox-test
