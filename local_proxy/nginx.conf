# Vorschaltung fuer SearXNG (8888) auf 127.0.0.1.
#
# SearXNG hat keine Anmeldung und prueft den Host-Header nicht. Eine Webseite im
# Browser koennte per DNS-Rebinding ihren eigenen Namen auf 127.0.0.1 zeigen lassen
# und SearXNG dann als ihre Suchmaschine benutzen. Der Browser schickt dabei aber
# ihren Namen als Host. Deshalb kommt hier nur durch, wer localhost oder 127.0.0.1
# anspricht; alles andere bekommt 421.
#
# Phoenix und die Modell-Dienste veroeffentlicht intern-proxy (intern.conf). Dieser
# Proxy haengt nur im Netz "backend", damit kein Dienst aus "intern" ueber ihn an
# SearXNG und damit ins Internet kommt.
#
# Im Docker-Netz sprechen Backend und Healthchecks SearXNG weiter direkt an
# (searxng:8080).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    # Schreibgeschuetztes Dateisystem: Zwischenablagen nach /tmp (tmpfs).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    access_log off;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;

    # Namen zur Laufzeit ueber Dockers DNS aufloesen: Startet SearXNG neu und
    # bekommt eine andere Adresse, findet der Proxy sie trotzdem, und er startet
    # auch, wenn SearXNG gerade fehlt.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8888 default_server;
        return 421;
    }
    server {
        listen 8888;
        server_name localhost 127.0.0.1;
        set $searxng_upstream http://searxng:8080;
        location / {
            proxy_pass $searxng_upstream;
            proxy_set_header Host $http_host;
        }
    }
}
