# intern-proxy: veroeffentlicht die Dienste aus dem Netz "intern" auf 127.0.0.1.
#
# Modell, Einbettung, Reranker, Sprache und Phoenix haengen in einem Netz ohne
# Ausgang. Docker veroeffentlicht aus einem solchen Netz keine Ports, deshalb
# reicht dieser Proxy sie durch. Er leitet nur an Ziele in "intern" weiter; ein
# Dienst von dort kommt ueber ihn also nirgends hin, wo er nicht ohnehin hinkaeme.
#
# Namen loest er zur Laufzeit ueber Dockers DNS auf: Er startet auch, wenn ein
# Dienst gerade fehlt, und findet ihn nach einem Neustart unter neuer Adresse.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    # Je durchgereichter Verbindung zwei (Client und Dienst).
    worker_connections 1024;
}

# ---- Phoenix (6006): UI und Trace-Empfang, ohne Anmeldung ----
# Mit Host-Pruefung gegen DNS-Rebinding: Eine Webseite, die ihren Namen auf
# 127.0.0.1 zeigen laesst, schickt ihren Namen als Host und bekommt 421. Sonst
# koennte sie Traces (Prompts, Dateiinhalte) mitlesen.
http {
    # Schreibgeschuetztes Dateisystem: Zwischenablagen nach /tmp (tmpfs).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    access_log off;
    server_tokens off;
    # Trace-Export der App schickt Stapel von Spans.
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 6006 default_server;
        return 421;
    }
    server {
        listen 6006;
        server_name localhost 127.0.0.1;
        set $phoenix_upstream http://phoenix:6006;
        location / {
            proxy_pass $phoenix_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}

# ---- Modell, Einbettung, Reranker, Sprache: TCP unveraendert durchgereicht ----
# So bleiben Streaming, Uploads und lange Antworten genau wie vorher, als die
# Dienste ihre Ports selbst veroeffentlicht haben. Alle verlangen den API-Key,
# den eine fremde Webseite nicht hat; eine Host-Pruefung braucht es hier nicht.
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_connect_timeout 5s;
    # Zeit ohne Daten in beide Richtungen. Einen langen Prompt liest das Modell
    # einige Minuten ein, bevor es das erste Zeichen schickt.
    proxy_timeout 30m;

    server {
        listen 30000;
        set $upstream llm:8080;
        proxy_pass $upstream;
    }
    server {
        listen 30001;
        set $upstream embed:8080;
        proxy_pass $upstream;
    }
    server {
        listen 30002;
        set $upstream rerank:8080;
        proxy_pass $upstream;
    }
    server {
        listen 8002;
        set $upstream tts-service:8002;
        proxy_pass $upstream;
    }
    server {
        listen 8003;
        set $upstream stt-service:8003;
        proxy_pass $upstream;
    }
}
